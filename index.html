<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberProxy Android PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .terminal-glow { box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- Header & Install Banner -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="mono font-bold tracking-wider text-emerald-400 text-base">CYBER_PROXY</h1>
            </div>
            <button id="installBtn" class="hidden bg-emerald-500 hover:bg-emerald-400 text-black font-semibold text-xs px-3 py-1.5 rounded-lg mono transition-all shadow-lg">
                📱 Install APK
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-3 space-y-3 flex-grow">

        <!-- Status Card -->
        <div id="statusCard" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between transition-all">
            <div>
                <p class="text-[10px] text-slate-400 mono">STATUS KONEKSI</p>
                <p id="statusText" class="text-base font-bold text-red-500 mono mt-0.5">OFFLINE</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400 mono">LATENCY</p>
                <p id="latencyText" class="text-xs font-semibold text-slate-300 mono mt-0.5">-- ms</p>
            </div>
        </div>

        <!-- IP Target Input -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <label class="block text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">1. Masukkan IP Target</label>
            <div class="flex space-x-2">
                <input type="text" id="targetIp" placeholder="Contoh: 192.168.1.1" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs mono w-full focus:outline-none focus:border-emerald-500 text-emerald-300 placeholder-slate-600">
                <button onclick="pasteIp()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 rounded-lg text-xs font-semibold mono transition-all">Tempel</button>
            </div>
        </div>

        <!-- 5 Search Modes Selection -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <label class="block text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">2. Pilih Mode Pencarian</label>
            <select id="searchMode" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs mono w-full focus:outline-none focus:border-emerald-500 text-slate-200 truncate">
                <option value="smart">Smart Auto Scan</option>
                <option value="custom">Custom Mode & ASN Preset</option>
                <option value="asn">ASN Only</option>
                <option value="city">City Only</option>
                <option value="country">Country Only</option>
            </select>
            <div id="customModeInputContainer" class="hidden pt-1">
                <input type="text" id="customParamInput" placeholder="Masukkan Nomor ASN / Target (cth: AS15169)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs mono w-full focus:outline-none focus:border-emerald-500 text-emerald-300 placeholder-slate-600">
            </div>
            <button onclick="startScanning()" id="scanBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold text-xs py-2 rounded-lg mono border border-slate-700 transition-all">
                🔍 Cari & Temukan IP Terdekat
            </button>
        </div>

        <!-- Octet Selector (4/4, 3/4, 2/4, 1/4) -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <label class="block text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">3. Pilih Tingkat Oktet</label>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="selectOctet('4/4')" id="oct4" class="octet-btn bg-slate-950 border border-slate-800 py-1.5 rounded-lg text-xs font-semibold mono text-slate-400 hover:border-emerald-500 transition-all">4/4</button>
                <button onclick="selectOctet('3/4')" id="oct3" class="octet-btn bg-slate-950 border border-slate-800 py-1.5 rounded-lg text-xs font-semibold mono text-slate-400 hover:border-emerald-500 transition-all">3/4</button>
                <button onclick="selectOctet('2/4')" id="oct2" class="octet-btn bg-slate-950 border border-slate-800 py-1.5 rounded-lg text-xs font-semibold mono text-slate-400 hover:border-emerald-500 transition-all">2/4</button>
                <button onclick="selectOctet('1/4')" id="oct1" class="octet-btn bg-slate-950 border border-slate-800 py-1.5 rounded-lg text-xs font-semibold mono text-slate-400 hover:border-emerald-500 transition-all">1/4</button>
            </div>
        </div>

        <!-- ON / OFF Power Switch -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="toggleProxy('ON')" id="onBtn" class="bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs py-3 rounded-xl mono transition-all shadow-lg opacity-80">
                ▶ TURN ON
            </button>
            <button onclick="toggleProxy('OFF')" id="offBtn" class="bg-red-600/20 border border-red-500/50 hover:bg-red-600/30 text-red-400 font-extrabold text-xs py-3 rounded-xl mono transition-all">
                ⏹ TURN OFF
            </button>
        </div>

        <!-- Terminal Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <div class="flex justify-between items-center">
                <span class="text-[10px] text-slate-400 mono uppercase">Terminal Log</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            </div>
            <div id="terminalLog" class="bg-slate-950 border border-slate-900 rounded-lg p-2.5 h-24 overflow-y-auto text-[11px] mono text-emerald-400 terminal-glow space-y-1">
                <div>[System] CyberProxy siap diinisialisasi...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-slate-600 text-[10px] mono border-t border-slate-900">
        CyberProxy Mobile Edition © 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let selectedOctetValue = null;
        let isProxyActive = false;
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        document.getElementById('searchMode').addEventListener('change', function() {
            const customContainer = document.getElementById('customModeInputContainer');
            if (this.value === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }
        });

        function logToTerminal(message) {
            const term = document.getElementById('terminalLog');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<div>[${time}] ${message}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        async function pasteIp() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('targetIp').value = text;
                logToTerminal(`IP Target ditempel: ${text}`);
            } catch (err) {
                alert('Gagal menempel dari clipboard. Silakan ketik manual.');
            }
        }

        function startScanning() {
            const ip = document.getElementById('targetIp').value.trim();
            const mode = document.getElementById('searchMode').value;
            
            if (!ip) {
                alert('Silakan masukkan atau tempel IP target terlebih dahulu!');
                return;
            }

            logToTerminal(`Memulai pemindaian menggunakan mode: [${mode.toUpperCase()}]...`);
            document.getElementById('scanBtn').innerText = '⏳ Memindai Node Terdekat...';
            document.getElementById('scanBtn').disabled = true;

            setTimeout(() => {
                let simulatedFoundIp = generateRandomNearIp(ip);
                logToTerminal(`Target IP Ditemukan: ${simulatedFoundIp} (Latensi: 14ms)`);
                document.getElementById('scanBtn').innerText = '🔍 Cari & Temukan IP Terdekat';
                document.getElementById('scanBtn').disabled = false;
            }, 1500);
        }

        function generateRandomNearIp(baseIp) {
            let parts = baseIp.split('.');
            if (parts.length === 4) {
                parts[3] = Math.floor(Math.random() * 200) + 1;
                return parts.join('.');
            }
            return "103.24.112.55";
        }

        function selectOctet(octet) {
            selectedOctetValue = octet;
            document.querySelectorAll('.octet-btn').forEach(btn => {
                btn.classList.remove('border-emerald-500', 'text-emerald-400', 'bg-slate-900');
                btn.classList.add('text-slate-400', 'bg-slate-950');
            });
            const activeBtn = document.getElementById('oct' + octet.charAt(0));
            activeBtn.classList.remove('text-slate-400', 'bg-slate-950');
            activeBtn.classList.add('border-emerald-500', 'text-emerald-400', 'bg-slate-900');
            logToTerminal(`Oktet dipilih: ${octet}`);
        }

        function toggleProxy(state) {
            const ip = document.getElementById('targetIp').value.trim();
            if (state === 'ON') {
                if (!ip) {
                    alert('Harap masukkan IP target terlebih dahulu!');
                    return;
                }
                if (!selectedOctetValue) {
                    alert('Harap pilih tingkat oktet terlebih dahulu (4/4, 3/4, 2/4, atau 1/4)!');
                    return;
                }

                isProxyActive = true;
                document.getElementById('statusText').innerText = 'ONLINE';
                document.getElementById('statusText').className = 'text-base font-bold text-emerald-400 mono mt-0.5';
                document.getElementById('statusCard').className = 'bg-slate-900 border border-emerald-500/50 rounded-xl p-3.5 flex items-center justify-between transition-all glow-green';
                document.getElementById('latencyText').innerText = '12 ms';
                logToTerminal(`Proxy BERHASIL diaktifkan dengan Oktet ${selectedOctetValue}!`);
            } else {
                isProxyActive = false;
                document.getElementById('statusText').innerText = 'OFFLINE';
                document.getElementById('statusText').className = 'text-base font-bold text-red-500 mono mt-0.5';
                document.getElementById('statusCard').className = 'bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between transition-all';
                document.getElementById('latencyText').innerText = '-- ms';
                logToTerminal(`Proxy dimatikan.`);
            }
        }
    </script>
</body>
</html>
